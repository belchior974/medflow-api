# ============================================================
# Stack local completa do MedFlow (.NET 9).
#   docker compose up -d --build
#
# PostgreSQL -> 5432   | Redis    -> 6379
# Prometheus -> 9090   | Grafana  -> 3000 (admin/admin)
# Zipkin     -> 9411   | WireMock -> 8089 (servico de convenio simulado)
# API        -> 8080
#
# Nomes e portas sao os padroes; use MEDFLOW_PREFIX e MEDFLOW_PORTA_* para rodar
# em paralelo com outra stack (ex.: a versao Spring Boot desta mesma API).
# ============================================================
services:

  postgres:
    image: postgres:16-alpine
    container_name: ${MEDFLOW_PREFIX:-medflow}-postgres
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow
    ports: [ "${MEDFLOW_PORTA_PG:-5432}:5432" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U medflow -d medflow" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${MEDFLOW_PREFIX:-medflow}-redis
    ports: [ "${MEDFLOW_PORTA_REDIS:-6379}:6379" ]
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Servico EXTERNO de convenio (simulado) ────────────────
  # E este container que sera derrubado no video para provar o
  # circuit breaker e o fallback:  docker compose stop wiremock
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: ${MEDFLOW_PREFIX:-medflow}-convenio-mock
    ports: [ "${MEDFLOW_PORTA_WIREMOCK:-8089}:8080" ]
    command: [ "--global-response-templating", "--verbose" ]
    volumes:
      - ./docker/wiremock:/home/wiremock

  prometheus:
    image: prom/prometheus:latest
    container_name: ${MEDFLOW_PREFIX:-medflow}-prometheus
    ports: [ "${MEDFLOW_PORTA_PROMETHEUS:-9090}:9090" ]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:latest
    container_name: ${MEDFLOW_PREFIX:-medflow}-grafana
    ports: [ "${MEDFLOW_PORTA_GRAFANA:-3000}:3000" ]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [ prometheus ]

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: ${MEDFLOW_PREFIX:-medflow}-zipkin
    ports: [ "${MEDFLOW_PORTA_ZIPKIN:-9411}:9411" ]

  api:
    build: .
    container_name: ${MEDFLOW_PREFIX:-medflow}-api
    ports: [ "${MEDFLOW_PORTA_API:-8080}:8080" ]
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zipkin:
        condition: service_started
      wiremock:
        condition: service_started

volumes:
  postgres_data:
  grafana_data:
